<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>匿名聊天室</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <script src="/socket.io/socket.io.js"></script>
</head>

<body>

<!-- ================= 登录 ================= -->

<div id="authPage" class="auth-page">

    <div class="auth-card">

        <div class="logo">
            💬
        </div>

        <h1>匿名聊天室</h1>

        <p class="sub">
            简洁、快速、匿名交流
        </p>

        <input
            id="username"
            placeholder="用户名"
            maxlength="32"
        >

        <input
            id="password"
            type="password"
            placeholder="密码"
        >

        <button onclick="login()">
            登录
        </button>

        <button
            class="secondary"
            onclick="register()"
        >
            注册账号
        </button>

        <div id="authError"></div>

    </div>

</div>


<!-- ================= 主界面 ================= -->

<div id="app" class="app hidden">

    <!-- 侧边栏 -->

    <aside class="sidebar">

        <div class="brand">
            💬 匿名聊天室
        </div>

        <div class="profile">

            <div class="avatar">
                👤
            </div>

            <div>
                <strong id="myUsername"></strong>
                <small id="myRole"></small>
            </div>

        </div>

        <button
            class="side-btn active"
            onclick="openPublic()"
        >
            🌎 公共频道
        </button>

        <button
            class="side-btn"
            onclick="showFriends()"
        >
            👥 好友
            <span id="friendBadge"></span>
        </button>

        <button
            class="side-btn"
            onclick="showRooms()"
        >
            💬 群聊
        </button>

        <button
            class="side-btn"
            onclick="showFriendRequests()"
        >
            🔔 好友申请
            <span id="requestBadge"></span>
        </button>

        <div class="sidebar-bottom">

            <button
                id="adminButton"
                class="side-btn admin hidden"
                onclick="showAdmin()"
            >
                🛡 管理员
            </button>

            <button
                class="side-btn logout"
                onclick="logout()"
            >
                🚪 退出登录
            </button>

        </div>

    </aside>


    <!-- 主聊天 -->

    <main class="main">

        <header class="chat-header">

            <div>

                <h2 id="chatTitle">
                    🌎 公共频道
                </h2>

                <span id="chatStatus">
                    所有人都可以聊天
                </span>

            </div>

            <div id="headerActions"></div>

        </header>


        <section
            id="messages"
            class="messages"
        ></section>


        <!-- 输入区域 -->

        <div class="composer">

            <textarea
                id="messageInput"
                rows="1"
                maxlength="2000"
                placeholder="输入消息..."
            ></textarea>

            <button
                onclick="sendMessage()"
                class="send-btn"
            >
                发送
            </button>

        </div>

    </main>


    <!-- 右侧面板 -->

    <aside
        id="rightPanel"
        class="right-panel hidden"
    ></aside>

</div>


<!-- ================= 弹窗 ================= -->

<div
    id="modal"
    class="modal hidden"
>

    <div class="modal-card">

        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<script src="/app.js"></script>

</body>

</html>
