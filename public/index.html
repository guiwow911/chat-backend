<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>简聊</title>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
}

body{

  font-family:
    Inter,
    Arial,
    "Microsoft YaHei",
    sans-serif;

  background:#f5f7fb;

  color:#1e2430;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =========================
   登录
========================= */

.auth{

  width:100%;
  height:100%;

  display:flex;

  justify-content:center;

  align-items:center;

  background:
    linear-gradient(
      135deg,
      #eef1ff,
      #ffffff
    );

}

.auth-card{

  width:390px;

  padding:34px;

  background:#fff;

  border:
    1px solid
    #e6e9ef;

  border-radius:20px;

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.08);

}

.logo{

  font-size:30px;

  font-weight:900;

  margin-bottom:5px;

}

.subtitle{

  color:#8b93a3;

  font-size:14px;

  margin-bottom:26px;

}

.auth-title{

  margin:
    0 0 18px;

}

.field{

  margin-bottom:15px;

}

.field label{

  display:block;

  margin-bottom:7px;

  font-size:13px;

  font-weight:700;

}

.input{

  width:100%;

  border:
    1px solid
    #dfe3eb;

  border-radius:11px;

  padding:
    12px 13px;

  outline:none;

  transition:.2s;

}

.input:focus{

  border-color:#5865f2;

  box-shadow:
    0 0 0 3px
    rgba(88,101,242,.1);

}

.primary{

  background:#5865f2;

  color:#fff;

  border:0;

}

.primary:hover{

  background:#4752c4;

}

.full{

  width:100%;

  padding:12px;

  border-radius:11px;

  font-weight:700;

}

.switch{

  width:100%;

  margin-top:12px;

  background:transparent;

  color:#5865f2;

  border:0;

}


/* =========================
   APP
========================= */

.app{

  width:100%;

  height:100vh;

  display:flex;

}


/* =========================
   左侧
========================= */

.sidebar{

  width:250px;

  height:100%;

  background:#fff;

  border-right:
    1px solid
    #e8ebf0;

  padding:15px;

  display:flex;

  flex-direction:column;

  overflow:auto;

}

.brand{

  padding:
    8px 10px
    20px;

  font-size:21px;

  font-weight:900;

}

.nav-button{

  width:100%;

  padding:
    11px 12px;

  text-align:left;

  border:0;

  background:transparent;

  color:#596273;

  border-radius:10px;

  margin-bottom:3px;

}

.nav-button:hover{

  background:#f0f2ff;

  color:#5865f2;

}

.admin-button{

  color:#a56b00;

}

.section-title{

  margin:
    20px 9px
    7px;

  color:#9ba2af;

  font-size:11px;

  font-weight:900;

}

.list-item{

  display:flex;

  align-items:center;

  gap:9px;

  padding:
    8px 9px;

  border-radius:10px;

  cursor:pointer;

}

.list-item:hover{

  background:#f5f6f8;

}

.avatar{

  width:35px;

  height:35px;

  border-radius:50%;

  display:flex;

  justify-content:center;

  align-items:center;

  background:#e9ebff;

  color:#5865f2;

  font-weight:900;

  flex:none;

}

.profile{

  margin-top:auto;

  padding:
    14px 7px
    4px;

  border-top:
    1px solid
    #edf0f4;

  display:flex;

  align-items:center;

  gap:9px;

}

.profile-name{

  font-weight:800;

}

.profile-status{

  color:#8c94a2;

  font-size:12px;

}


/* =========================
   中间
========================= */

.main{

  flex:1;

  min-width:0;

  display:flex;

  flex-direction:column;

}

.header{

  height:62px;

  flex:none;

  display:flex;

  align-items:center;

  gap:10px;

  padding:
    0 22px;

  background:#fff;

  border-bottom:
    1px solid
    #e8ebf0;

  font-weight:900;

}

.online{

  color:#20a56c;

  font-size:12px;

}

.messages{

  flex:1;

  overflow:auto;

  padding:
    22px 8%;

  background:#fafbfd;

}

.message{

  display:flex;

  gap:9px;

  margin:
    15px 0;

}

.message.mine{

  justify-content:flex-end;

}

.message.mine .message-content{

  order:-1;

}

.message-content{

  max-width:
    min(720px,75%);

}

.message-name{

  color:#626b7b;

  font-size:12px;

  font-weight:800;

  margin-bottom:4px;

}

.message-bubble{

  padding:
    10px 13px;

  border:
    1px solid
    #e6e9ef;

  background:#fff;

  border-radius:14px;

  line-height:1.5;

  word-break:break-word;

  white-space:pre-wrap;

}

.message.mine
.message-bubble{

  background:#5865f2;

  color:#fff;

  border-color:#5865f2;

}

.game-link{

  color:#5865f2;

  font-weight:900;

  text-decoration:none;

}

.message.mine .game-link{

  color:#fff;

  text-decoration:underline;

}

.composer{

  flex:none;

  display:flex;

  gap:9px;

  padding:
    13px 7%;

  background:#fff;

  border-top:
    1px solid
    #e8ebf0;

}

.composer input{

  flex:1;

}

.send{

  width:48px;

  border-radius:11px;

}


/* =========================
   右侧
========================= */

.info{

  width:280px;

  padding:20px;

  background:#fff;

  border-left:
    1px solid
    #e8ebf0;

  overflow:auto;

}

.info-card{

  padding:15px;

  border:
    1px solid
    #e7eaf0;

  border-radius:13px;

  margin-bottom:12px;

}

.info-card-title{

  font-weight:900;

}

.info-card-text{

  color:#8a92a0;

  line-height:1.6;

  font-size:13px;

}


/* =========================
   弹窗
========================= */

.modal{

  position:fixed;

  inset:0;

  background:
    rgba(15,20,30,.5);

  display:none;

  justify-content:center;

  align-items:center;

  padding:20px;

  z-index:100;

}

.modal.show{

  display:flex;

}

.modal-card{

  width:
    min(700px,95vw);

  max-height:
    90vh;

  overflow:auto;

  background:#fff;

  border-radius:18px;

  padding:24px;

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.2);

}

.modal-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

}

.close{

  border:0;

  background:#f1f3f7;

  width:35px;

  height:35px;

  border-radius:50%;

}


/* =========================
   管理员
========================= */

.admin-user{

  padding:13px;

  border:
    1px solid
    #e6e9ef;

  border-radius:12px;

  margin-top:9px;

}

.admin-row{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

}

.admin-name{

  font-weight:900;

}

.admin-meta{

  color:#8b93a1;

  font-size:12px;

  margin-top:3px;

}

.admin-actions{

  display:flex;

  gap:6px;

  flex-wrap:wrap;

  justify-content:flex-end;

}

.admin-actions button{

  border:0;

  padding:
    8px 10px;

  border-radius:8px;

  background:#eef0ff;

  color:#5865f2;

  font-weight:700;

}

.admin-actions .danger{

  background:#ffe8e8;

  color:#c62828;

}

.admin-actions .warning{

  background:#fff2cf;

  color:#956500;

}

.badge{

  display:inline-block;

  padding:
    3px 7px;

  border-radius:20px;

  font-size:11px;

  background:#f0f2f6;

  color:#707887;

}


/* =========================
   响应式
========================= */

@media(max-width:950px){

  .info{

    display:none;

  }

}

@media(max-width:650px){

  .sidebar{

    width:72px;

    padding:8px;

  }

  .brand{

    text-align:center;

    font-size:0;

  }

  .brand::after{

    content:"简";

    font-size:22px;

  }

  .nav-button{

    text-align:center;

    font-size:0;

  }

  .nav-button::first-letter{

    font-size:20px;

  }

  .section-title{

    display:none;

  }

  .list-item span{

    display:none;

  }

  .list-item{

    justify-content:center;

  }

  .profile-name,
  .profile-status{

    display:none;

  }

  .messages{

    padding:
      15px 3%;

  }

  .composer{

    padding:10px;

  }

}

</style>

</head>


<body>


<!-- ======================================================
     登录
====================================================== -->

<div
  id="authPage"
  class="auth"
>

  <div class="auth-card">

    <div class="logo">
      简聊
    </div>

    <div class="subtitle">
      简洁 · 实时 · 好友 · 群聊
    </div>


    <!-- 登录 -->

    <div id="loginPanel">

      <h2 class="auth-title">
        登录
      </h2>

      <div class="field">

        <label>
          用户名
        </label>

        <input
          id="loginUsername"
          class="input"
          autocomplete="username"
        >

      </div>

      <div class="field">

        <label>
          密码
        </label>

        <input
          id="loginPassword"
          class="input"
          type="password"
          autocomplete="current-password"
        >

      </div>

      <button
        class="full primary"
        onclick="login()"
      >
        登录
      </button>

      <button
        class="switch"
        onclick="toggleAuth()"
      >
        没有账号？立即注册
      </button>

    </div>


    <!-- 注册 -->

    <div
      id="registerPanel"
      class="hidden"
    >

      <h2 class="auth-title">
        注册
      </h2>

      <div class="field">

        <label>
          用户名
        </label>

        <input
          id="registerUsername"
          class="input"
          autocomplete="username"
        >

      </div>

      <div class="field">

        <label>
          密码
        </label>

        <input
          id="registerPassword"
          class="input"
          type="password"
          autocomplete="new-password"
        >

      </div>

      <button
        class="full primary"
        onclick="register()"
      >
        注册并进入
      </button>

      <button
        class="switch"
        onclick="toggleAuth()"
      >
        返回登录
      </button>

    </div>

  </div>

</div>


<!-- ======================================================
     主界面
====================================================== -->

<div
  id="app"
  class="app hidden"
>


  <!-- 左侧 -->

  <aside class="sidebar">

    <div class="brand">
      简聊
    </div>


    <button
      class="nav-button"
      onclick="
        openChannel(
          'public',
          'public',
          '公共频道'
        )
      "
    >
      💬 公共频道
    </button>


    <button
      class="nav-button"
      onclick="
        showModal('createGroup')
      "
    >
      ➕ 创建群聊
    </button>


    <button
      class="nav-button"
      onclick="
        showModal('joinGroup')
      "
    >
      🔗 加入群聊
    </button>


    <button
      class="nav-button"
      onclick="
        showModal('addFriend')
      "
    >
      👤 添加好友
    </button>


    <button
      id="adminButton"
      class="nav-button admin-button hidden"
      onclick="openAdmin()"
    >
      👑 管理员
    </button>


    <div class="section-title">
      好友
    </div>

    <div id="friendList"></div>


    <div class="section-title">
      我的群聊
    </div>

    <div id="groupList"></div>


    <div class="profile">

      <div
        id="myAvatar"
        class="avatar"
      >
        ?
      </div>

      <div>

        <div
          id="myName"
          class="profile-name"
        ></div>

        <div
          id="myStatus"
          class="profile-status"
        >
          在线
        </div>

      </div>

    </div>

  </aside>


  <!-- 中间 -->

  <main class="main">

    <header class="header">

      <span id="channelTitle">
        公共频道
      </span>

      <span class="online">
        ● 在线
      </span>

    </header>


    <section
      id="messages"
      class="messages"
    ></section>


    <div class="composer">

      <input
        id="messageInput"
        class="input"
        placeholder="输入消息，Enter发送"
        onkeydown="
          if(
            event.key === 'Enter' &&
            !event.shiftKey
          ){
            event.preventDefault();
            sendMessage();
          }
        "
      >

      <button
        class="send primary"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </main>


  <!-- 右侧 -->

  <aside class="info">

    <div class="info-card">

      <div class="info-card-title">
        💬 公共聊天
      </div>

      <p class="info-card-text">
        欢迎来到简聊公共频道。
        你可以添加好友、创建群聊，
        与其他用户进行私聊。
      </p>

    </div>


    <div class="info-card">

      <div class="info-card-title">
        🎮 特殊链接
      </div>

      <p class="info-card-text">
        在公共频道输入
        <b>@地铁跑酷</b>
        可以打开特殊网站。
      </p>

    </div>

  </aside>

</div>


<!-- ======================================================
     普通弹窗
====================================================== -->

<div
  id="normalModal"
  class="modal"
>

  <div class="modal-card">

    <div class="modal-head">

      <h2 id="modalTitle">
        操作
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ✕
      </button>

    </div>


    <div class="field">

      <label id="modalLabel">
        内容
      </label>

      <input
        id="modalInput"
        class="input"
      >

    </div>


    <button
      class="full primary"
      onclick="confirmModal()"
    >
      确定
    </button>

  </div>

</div>


<!-- ======================================================
     管理员弹窗
====================================================== -->

<div
  id="adminModal"
  class="modal"
>

  <div class="modal-card">

    <div class="modal-head">

      <div>

        <h2>
          👑 管理员面板
        </h2>

        <div class="admin-meta">
          用户管理
        </div>

      </div>

      <button
        class="close"
        onclick="closeAdmin()"
      >
        ✕
      </button>

    </div>


    <div id="adminUsers"></div>

  </div>

</div>


<script>

/* ======================================================
   全局状态
====================================================== */

let token =
  localStorage.getItem(
    "jiliao_token"
  ) || "";

let currentUser = null;

let socket = null;

let currentChannel = {

  type:"public",

  id:"public"

};

let modalType = "";


/* ======================================================
   DOM
====================================================== */

function $(id){

  return document.getElementById(id);

}


/* ======================================================
   HTML 转义
====================================================== */

function escapeHTML(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      char => {

        const map = {

          "&":"&amp;",

          "<":"&lt;",

          ">":"&gt;",

          '"':"&quot;",

          "'":"&#039;"

        };

        return map[char];

      }
    );

}


/* ======================================================
   API
====================================================== */

async function api(
  url,
  options = {}
){

  options.headers = {

    ...(options.headers || {}),

    "Content-Type":
      "application/json"

  };


  if(token){

    options.headers.Authorization =
      "Bearer " + token;

  }


  const response =
    await fetch(
      url,
      options
    );


  const data =
    await response
      .json()
      .catch(
        () => ({})
      );


  if(!response.ok){

    throw new Error(
      data.error ||
      "请求失败"
    );

  }


  return data;

}


/* ======================================================
   登录/注册页面
====================================================== */

function toggleAuth(){

  $("loginPanel")
    .classList
    .toggle("hidden");

  $("registerPanel")
    .classList
    .toggle("hidden");

}


async function register(){

  try{

    const username =
      $("registerUsername")
        .value
        .trim();

    const password =
      $("registerPassword")
        .value;


    const data =
      await api(
        "/api/register",
        {

          method:"POST",

          body:
            JSON.stringify({

              username,

              password

            })

        }
      );


    await enterApp(
      data
    );

  }catch(error){

    alert(
      error.message
    );

  }

}


async function login(){

  try{

    const username =
      $("loginUsername")
        .value
        .trim();

    const password =
      $("loginPassword")
        .value;


    const data =
      await api(
        "/api/login",
        {

          method:"POST",

          body:
            JSON.stringify({

              username,

              password

            })

        }
      );


    await enterApp(
      data
    );

  }catch(error){

    alert(
      error.message
    );

  }

}


/* ======================================================
   进入 App
====================================================== */

async function enterApp(
  data
){

  token =
    data.token;

  currentUser =
    data.user;


  localStorage.setItem(
    "jiliao_token",
    token
  );


  $("authPage")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");


  $("myName")
    .textContent =
    currentUser.username;


  $("myAvatar")
    .textContent =
    currentUser.username[0]
    || "?";


  updateMyStatus();


  if(currentUser.is_admin){

    $("adminButton")
      .classList
      .remove("hidden");

  }


  connectSocket();

  await loadSidebar();

  await openChannel(
    "public",
    "public",
    "公共频道"
  );

}


/* ======================================================
   状态
====================================================== */

function updateMyStatus(){

  $("myStatus")
    .textContent =
    currentUser.is_muted
      ? "🔇 已禁言"
      : "● 在线";

}


/* ======================================================
   Socket.IO
====================================================== */

function connectSocket(){

  socket =
    io({

      auth:{
        token
      }

    });


  socket.on(
    "connect",
    () => {

      console.log(
        "Socket connected"
      );

      socket.emit(
        "join",
        currentChannel
      );

    }
  );


  socket.on(
    "message",
    message => {

      if(
        message.channel_type ===
        currentChannel.type &&

        String(
          message.channel_id
        ) ===
        String(
          currentChannel.id
        )
      ){

        renderMessages(
          [message],
          true
        );

      }

    }
  );


  socket.on(
    "user_moderated",
    event => {

      if(
        event.userId !==
        currentUser.id
      ){

        return;

      }


      if(
        event.field ===
        "is_muted"
      ){

        currentUser.is_muted =
          event.value;

        updateMyStatus();


        alert(
          event.value
            ? "你已被管理员禁言"
            : "你已解除禁言"
        );

      }


      if(
        event.field ===
        "is_banned" &&
        event.value
      ){

        alert(
          "你的账号已被管理员封禁"
        );

        logout();

      }

    }
  );


  socket.on(
    "connect_error",
    error => {

      console.error(
        "Socket error:",
        error.message
      );

    }
  );

}


/* ======================================================
   加载侧边栏
====================================================== */

async function loadSidebar(){

  try{

    const friends =
      await api(
        "/api/friends"
      );

    const groups =
      await api(
        "/api/groups"
      );


    renderFriends(
      friends
    );

    renderGroups(
      groups
    );

  }catch(error){

    console.error(
      error
    );

  }

}


/* ======================================================
   好友
====================================================== */

function renderFriends(
  friends
){

  $("friendList")
    .innerHTML =
    "";


  if(
    friends.length === 0
  ){

    $("friendList")
      .innerHTML = `
        <div
          style="
            color:#9aa1ae;
            padding:8px;
            font-size:12px;
          "
        >
          暂无好友
        </div>
      `;

    return;

  }


  for(
    const friend
    of friends
  ){

    $("friendList")
      .insertAdjacentHTML(
        "beforeend",

        `

        <div
          class="list-item"
          onclick="
            openChannel(
              'private',
              '${friend.id}',
              '与 ${escapeHTML(
                friend.username
              )} 私聊'
            )
          "
        >

          <div class="avatar">

            ${escapeHTML(
              friend.username[0] || "?"
            )}

          </div>

          <span>
            ${escapeHTML(
              friend.username
            )}
          </span>

        </div>

        `

      );

  }

}


/* ======================================================
   群聊
====================================================== */

function renderGroups(
  groups
){

  $("groupList")
    .innerHTML =
    "";


  if(
    groups.length === 0
  ){

    $("groupList")
      .innerHTML = `
        <div
          style="
            color:#9aa1ae;
            padding:8px;
            font-size:12px;
          "
        >
          暂无群聊
        </div>
      `;

    return;

  }


  for(
    const group
    of groups
  ){

    $("groupList")
      .insertAdjacentHTML(
        "beforeend",

        `

        <div
          class="list-item"
          onclick="
            openChannel(
              'group',
              '${group.id}',
              '# ${escapeHTML(
                group.name
              )}'
            )
          "
        >

          <div class="avatar">
            #
          </div>

          <span>
            ${escapeHTML(
              group.name
            )}
          </span>

        </div>

        `

      );

  }

}


/* ======================================================
   打开聊天
====================================================== */

async function openChannel(
  type,
  id,
  title
){

  currentChannel = {

    type,

    id:String(id)

  };


  $("channelTitle")
    .textContent =
    title;


  if(socket){

    socket.emit(
      "join",
      currentChannel
    );

  }


  try{

    const messages =
      await api(
        `/api/messages?type=${encodeURIComponent(type)}&id=${encodeURIComponent(id)}`
      );


    renderMessages(
      messages,
      false
    );

  }catch(error){

    alert(
      error.message
    );

  }

}


/* ======================================================
   消息特殊渲染
====================================================== */

function renderText(
  text
){

  let result =
    escapeHTML(
      text
    );


  /*
   * @地铁跑酷
   */

  result =
    result.replace(
      /@地铁跑酷/g,

      `<a
        class="game-link"
        href="https://subwaysurfers3dbyzjp.netlify.app/"
        target="_blank"
        rel="noopener noreferrer"
      >@地铁跑酷</a>`

    );


  return result;

}


/* ======================================================
   消息列表
====================================================== */

function renderMessages(
  messages,
  append
){

  if(!append){

    $("messages")
      .innerHTML =
      "";

  }


  for(
    const message
    of messages
  ){

    const mine =
      Number(
        message.user_id
      ) ===
      Number(
        currentUser.id
      );


    $("messages")
      .insertAdjacentHTML(
        "beforeend",

        `

        <div
          class="
            message
            ${mine ? "mine" : ""}
          "
        >

          <div class="avatar">

            ${escapeHTML(
              (
                message.username ||
                "?"
              )[0]
            )}

          </div>


          <div class="message-content">

            <div class="message-name">

              ${escapeHTML(
                message.username
              )}

            </div>


            <div class="message-bubble">

              ${renderText(
                message.text
              )}

            </div>

          </div>

        </div>

        `

      );

  }


  $("messages")
    .scrollTop =
    $("messages")
      .scrollHeight;

}


/* ======================================================
   发送消息
====================================================== */

async function sendMessage(){

  const input =
    $("messageInput");


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  try{

    await api(
      "/api/messages",
      {

        method:"POST",

        body:
          JSON.stringify({

            type:
              currentChannel.type,

            id:
              currentChannel.id,

            text

          })

      }
    );


    input.value =
      "";

    input.focus();

  }catch(error){

    alert(
      error.message
    );

  }

}


/* ======================================================
   普通弹窗
====================================================== */

function showModal(
  type
){

  modalType =
    type;


  $("normalModal")
    .classList
    .add("show");


  $("modalInput")
    .value =
    "";


  const configs = {

    addFriend:{

      title:
        "添加好友",

      label:
        "输入好友用户名",

      placeholder:
        "例如：Tom"

    },

    createGroup:{

      title:
        "创建群聊",

      label:
        "输入群名称",

      placeholder:
        "例如：游戏交流群"

    },

    joinGroup:{

      title:
        "加入群聊",

      label:
        "输入邀请码",

      placeholder:
        "例如：A8C21F..."

    }

  };


  const config =
    configs[type];


  $("modalTitle")
    .textContent =
    config.title;


  $("modalLabel")
    .textContent =
    config.label;


  $("modalInput")
    .placeholder =
    config.placeholder;


  $("modalInput")
    .focus();

}


function closeModal(){

  $("normalModal")
    .classList
    .remove("show");

}


async function confirmModal(){

  const value =
    $("modalInput")
      .value
      .trim();


  if(!value){

    alert(
      "请输入内容"
    );

    return;

  }


  try{

    if(
      modalType ===
      "addFriend"
    ){

      await api(
        "/api/friends",
        {

          method:"POST",

          body:
            JSON.stringify({

              username:value

            })

        }
      );


      await loadSidebar();

      alert(
        "添加好友成功"
      );

    }


    if(
      modalType ===
      "createGroup"
    ){

      const group =
        await api(
          "/api/groups",
          {

            method:"POST",

            body:
              JSON.stringify({

                name:value

              })

          }
        );


      await loadSidebar();


      await openChannel(
        "group",
        group.id,
        "# " + group.name
      );


      alert(
        "群聊创建成功\n\n" +
        "邀请码：\n" +
        group.invite_code
      );

    }


    if(
      modalType ===
      "joinGroup"
    ){

      const group =
        await api(
          "/api/groups/join",
          {

            method:"POST",

            body:
              JSON.stringify({

                inviteCode:value

              })

          }
        );


      await loadSidebar();


      await openChannel(
        "group",
        group.id,
        "# " + group.name
      );


      alert(
        "加入群聊成功"
      );

    }


    closeModal();

  }catch(error){

    alert(
      error.message
    );

  }

}


/* ======================================================
   管理员
====================================================== */

async function openAdmin(){

  $("adminModal")
    .classList
    .add("show");


  await loadAdminUsers();

}


function closeAdmin(){

  $("adminModal")
    .classList
    .remove("show");

}


async function loadAdminUsers(){

  try{

    const users =
      await api(
        "/api/admin/users"
      );


    $("adminUsers")
      .innerHTML =
      "";


    for(
      const user
      of users
    ){

      if(user.is_admin){

        $("adminUsers")
          .insertAdjacentHTML(
            "beforeend",

            `

            <div class="admin-user">

              <div class="admin-name">

                👑
                ${escapeHTML(
                  user.username
                )}

                <span class="badge">
                  管理员
                </span>

              </div>

            </div>

            `

          );

        continue;

      }


      const muteText =
        user.is_muted
          ? "解除禁言"
          : "禁言";


      const banText =
        user.is_banned
          ? "解封"
          : "封禁";


      $("adminUsers")
        .insertAdjacentHTML(
          "beforeend",

          `

          <div class="admin-user">

            <div class="admin-row">

              <div>

                <div class="admin-name">

                  ${escapeHTML(
                    user.username
                  )}

                </div>

                <div class="admin-meta">

                  ID：
                  ${user.id}

                  ${
                    user.is_muted
                      ? " · 🔇 已禁言"
                      : ""
                  }

                  ${
                    user.is_banned
                      ? " · 🚫 已封禁"
                      : ""
                  }

                </div>

              </div>


              <div class="admin-actions">

                <button
                  class="
                    ${
                      user.is_muted
                        ? "warning"
                        : ""
                    }
                  "
                  onclick="
                    moderate(
                      ${user.id},
                      '${
                        user.is_muted
                          ? "unmute"
                          : "mute"
                      }'
                    )
                  "
                >

                  ${muteText}

                </button>


                <button
                  class="
                    ${
                      user.is_banned
                        ? ""
                        : "danger"
                    }
                  "
                  onclick="
                    moderate(
                      ${user.id},
                      '${
                        user.is_banned
                          ? "unban"
                          : "ban"
                      }'
                    )
                  "
                >

                  ${banText}

                </button>

              </div>

            </div>

          </div>

          `

        );

    }

  }catch(error){

    alert(
      error.message
    );

  }

}


/* ======================================================
   管理操作
====================================================== */

async function moderate(
  id,
  action
){

  const names = {

    mute:
      "禁言",

    unmute:
      "解除禁言",

    ban:
      "封禁",

    unban:
      "解封"

  };


  if(
    !confirm(
      `确定要${names[action]}该用户吗？`
    )
  ){

    return;

  }


  try{

    await api(
      `/api/admin/users/${id}/${action}`,
      {

        method:"POST"

      }
    );


    await loadAdminUsers();

  }catch(error){

    alert(
      error.message
    );

  }

}


/* ======================================================
   退出
====================================================== */

function logout(){

  localStorage.removeItem(
    "jiliao_token"
  );

  token = "";

  currentUser = null;


  if(socket){

    socket.disconnect();

  }


  location.reload();

}


/* ======================================================
   自动登录
====================================================== */

async function autoLogin(){

  if(!token){

    return;

  }


  try{

    const data =
      await api(
        "/api/me"
      );


    await enterApp({

      token,

      user:
        data.user

    });

  }catch(error){

    console.log(
      "自动登录失败"
    );

    localStorage.removeItem(
      "jiliao_token"
    );

    token = "";

  }

}


/* ======================================================
   启动
====================================================== */

autoLogin();

</script>
