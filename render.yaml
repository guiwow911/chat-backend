services:
  - type: web
    name: jiliao-chat
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jiliao-db
          property: connectionString
databases:
  - name: jiliao-db
    plan: free
