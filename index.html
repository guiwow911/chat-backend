<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>聊天室</title>
</head>
<body>
    <div id="loginBox">
        <h3>注册 / 登录</h3>
        <input type="text" id="username" placeholder="用户名">
        <input type="password" id="password" placeholder="密码">
        <button onclick="register()">注册</button>
        <button onclick="login()">登录</button>
    </div>

    <div id="chatBox" style="display:none;">
        <div id="messageList"></div>
        <input type="text" id="inputMsg" placeholder="输入消息，发送@地铁跑酷触发跳转">
        <button onclick="sendMsg()">发送</button>
    </div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let userName = "";

// 【关键】监听后端跳转指令
socket.on("jumpSubwaySurfers", function(){
    window.location.href = "https://subwaysurfers3dbyzjp.netlify.app/";
})

//注册
async function register(){
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;
    const res = await fetch("/api/register",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:u,password:p})
    })
    const data = await res.json();
    alert(data.msg);
}

//登录
async function login(){
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;
    const res = await fetch("/api/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:u,password:p})
    })
    const data = await res.json();
    if(data.ok){
        userName = data.username;
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("chatBox").style.display = "block";
        socket.emit("login",userName);
    }else{
        alert(data.msg);
    }
}

//发送消息
function sendMsg(){
    const text = document.getElementById("inputMsg").value;
    if(!text)return;
    socket.emit("chat",text);
    document.getElementById("inputMsg").value = "";
}

//接收聊天
socket.on("chat",function(data){
    const div = document.createElement("div");
    div.innerText = `${data.name}: ${data.text}`;
    document.getElementById("messageList").appendChild(div);
})
</script>
</body>
</html>
