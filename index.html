<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>聊天室</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
        body{background:#12121a;color:#eeeeee;height:100vh;display:flex;overflow:hidden}
        .sidebar{width:220px;background:#181824;padding:14px;border-right:1px solid #29293d}
        .sidebar h4{margin-bottom:8px}
        .user-item{padding:7px 5px;margin:5px 0;color:#b6b6d0;font-size:15px;cursor:pointer;border-radius:4px}
        .user-item.active{background:#343868;color:#fff}
        .main-area{flex:1;display:flex;flex-direction:column;height:100%}
        #messageWrap{flex:1;padding:16px;overflow-y:auto}
        .msg-item{margin:7px 0;font-size:15px}
        .input-bar{display:flex;padding:12px;border-top:1px solid #29293d}
        #chatInput{flex:1;background:#1e1e2f;border:1px solid #343652;color:#ffffff;padding:9px 12px;border-radius:5px;font-size:15px}
        .input-bar button{background:#3c3c73;color:#fff;border:none;padding:8px 15px;border-radius:5px;margin-left:10px;cursor:pointer;font-size:14px}
        .login-mask{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:99}
        .login-box{background:#272742;padding:26px;border-radius:9px}
        .login-box input{display:block;width:270px;margin:11px 0;padding:9px;background:#1e1e2e;border:1px solid #444666;color:#fff;border-radius:5px;font-size:15px}
        .admin-dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:490px;background:#272742;border-radius:11px;padding:22px;border:1px solid #454575;max-height:86vh;overflow-y:auto;z-index:100}
        .ban-row{display:flex;align-items:center;margin:9px 0}
        .ban-name{width:145px}
        .perm-ban-tag{flex:1;background:#b72537;text-align:center;padding:5px 0;border-radius:4px;margin:0 10px}
        .unban-btn{background:#299b49;border:none;color:#fff;padding:6px 0;border-radius:4px;margin-left:10px;width:160px;cursor:pointer}
        .dialog-title{margin:14px 0 7px 0;font-weight:bold;font-size:17px}
        .close-btn{width:100%;margin-top:18px;padding:11px;background:#414179;border:none;color:#fff;border-radius:6px;cursor:pointer;font-size:15px}
        .tip-text{color:#7799ff;margin:6px 0}
    </style>
</head>
<body>
<div class="login-mask" id="loginMask">
    <div class="login-box">
        <h3>注册 / 登录</h3>
        <input type="text" id="username" placeholder="用户名">
        <input type="password" id="password" placeholder="密码">
        <button onclick="register()">注册</button>
        <button onclick="login()">登录</button>
    </div>
</div>

<div class="sidebar" id="sideBar" style="display:none">
    <h4>全局聊天室</h4>
    <div class="user-item active" onclick="switchChat('global')">🌐 全局公聊</div>
    <h4 style="margin-top:16px">好友列表</h4>
    <div id="friendDom"></div>
    <div style="margin-top:12px">
        <input id="addFriendInput" placeholder="输入用户名添加好友" style="width:100%;padding:6px;background:#1e1e2f;border:1px solid #333;color:#fff;border-radius:4px">
        <button onclick="addFriend()" style="width:100%;margin-top:6px">添加好友</button>
    </div>
</div>

<div class="main-area" id="chatMain" style="display:none">
    <div id="messageWrap"></div>
    <div class="input-bar">
        <input id="chatInput" placeholder="发送 @地铁跑酷 触发网页跳转">
        <button onclick="sendMessage()">发送</button>
        <button onclick="openAdmin()">管理面板</button>
    </div>
</div>

<div class="admin-dialog" id="adminDialog" style="display:none">
    <h3>账号管理</h3>
    <div class="dialog-title">当前禁言列表</div>
    <div>暂无禁言用户</div>
    <div class="dialog-title">账号封禁列表</div>
    <div id="banDom"></div>
    <button class="close-btn" onclick="closeAdmin()">关闭</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myName = "";
let adminFlag = false;
let currentChatMode = "global";
let currentPrivateTarget = null;
//会话缓存
let sessionCache = {
    global:[],
    private:{}
}

socket.on("jumpSubwaySurfers", function(){
    window.location.href = "https://subwaysurfers3dbyzjp.netlify.app/";
})

socket.on("friendList",(friendArr)=>{
    let dom = document.getElementById("friendDom");
    dom.innerHTML = "";
    friendArr.forEach(f=>{
        let d = document.createElement("div");
        d.className = "user-item";
        d.innerText = `👤 ${f}`;
        d.onclick = ()=>switchChat("private",f);
        dom.appendChild(d);
    })
})

socket.on("systemTip",res=>{
    let div = document.createElement("div");
    div.className="tip-text";
    div.innerText = `【系统】${res.msg}`;
    document.getElementById("messageWrap").appendChild(div);
})

async function register(){
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;
    const res = await fetch("/api/register",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:u,password:p})
    })
    const data = await res.json();
    alert(data.msg);
}

async function login(){
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;
    const res = await fetch("/api/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:u,password:p})
    })
    const data = await res.json();
    if(data.ok){
        myName = data.username;
        adminFlag = data.isAdmin;
        document.getElementById("loginMask").style.display = "none";
        document.getElementById("sideBar").style.display = "block";
        document.getElementById("chatMain").style.display = "flex";
        socket.emit("login", myName);
    }else{
        alert(data.msg);
    }
}

function addFriend(){
    let t = document.getElementById("addFriendInput").value.trim();
    if(!t)return;
    socket.emit("addFriend",t);
    document.getElementById("addFriendInput").value="";
}

function switchChat(mode,target=null){
    currentChatMode = mode;
    currentPrivateTarget = target;
    //清空消息框，读取缓存
    let wrap = document.getElementById("messageWrap");
    wrap.innerHTML = "";
    if(mode==="global"){
        sessionCache.global.forEach(item=>{
            let div = document.createElement("div");
            div.className="msg-item";
            div.innerText = `${item.name}: ${item.text}`;
            wrap.appendChild(div);
        })
    }else{
        if(!sessionCache.private[target]) sessionCache.private[target]=[];
        sessionCache.private[target].forEach(item=>{
            let div = document.createElement("div");
            div.className="msg-item";
            div.innerText = `${item.from}: ${item.text}`;
            wrap.appendChild(div);
        })
    }
}

function sendMessage(){
    const text = document.getElementById("chatInput").value.trim();
    if(!text) return;
    if(currentChatMode==="global"){
        socket.emit("chat", text);
        sessionCache.global.push({name:myName,text:text});
    }else{
        socket.emit("privateMsg",{targetName:currentPrivateTarget,text:text});
        if(!sessionCache.private[currentPrivateTarget]) sessionCache.private[currentPrivateTarget]=[];
        sessionCache.private[currentPrivateTarget].push({from:myName,text:text});
    }
    document.getElementById("chatInput").value = "";
    switchChat(currentChatMode,currentPrivateTarget);
}

socket.on("chat", (data)=>{
    sessionCache.global.push(data);
    if(currentChatMode==="global"){
        const div = document.createElement("div");
        div.className = "msg-item";
        div.innerText = `${data.name}: ${data.text}`;
        document.getElementById("messageWrap").appendChild(div);
    }
})

socket.on("privateReceive",(res)=>{
    let other = res.from===myName?res.to:res.from;
    if(!sessionCache.private[other]) sessionCache.private[other]=[];
    sessionCache.private[other].push(res);
    if(currentChatMode==="private" && currentPrivateTarget === other){
        const div = document.createElement("div");
        div.className = "msg-item";
        div.innerText = `${res.from}: ${res.text}`;
        document.getElementById("messageWrap").appendChild(div);
    }
})

socket.on("userList", (arr)=>{
})

function openAdmin(){
    if(!adminFlag){
        alert("你不是管理员");
        return;
    }
    document.getElementById("adminDialog").style.display = "block";
}
function closeAdmin(){
    document.getElementById("adminDialog").style.display = "none";
}
</script>
</body>
</html>
