<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#1a1a2e;color:#fff;max-width:800px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px}
.header{padding:10px 0;font-size:22px;font-weight:bold;text-align:center;border-bottom:1px solid #333}
#chatBox{flex:1;overflow-y:auto;padding:16px}
.msg-item{margin:8px 0}
.msg-self{text-align:right}
.msg-name{font-size:12px;color:#aaa;margin-bottom:3px}
.msg-content{display:inline-block;padding:8px 14px;border-radius:14px;max-width:70%}
.self{background:#2563eb}
.other{background:#334155}
.input-area{display:flex;gap:8px;padding:10px 0;border-top:1px solid #333}
#username{width:120px;padding:10px;border-radius:8px;border:none;background:#27293d;color:white}
#messageInput{flex:1;padding:10px;border-radius:8px;border:none;background:#27293d;color:white}
#sendBtn{padding:0 20px;border:none;border-radius:8px;background:#2563eb;color:white;cursor:pointer}
</style>
</head>
<body>
<div class="header">🌐聊天室</div>
<div id="chatBox"></div>
<div class="input-area">
<input id="username" placeholder="昵称" value="游客">
<input id="messageInput" placeholder="输入消息回车发送">
<button id="sendBtn">发送</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const chatBox = document.getElementById('chatBox');
const usernameInput = document.getElementById('username');
const msgInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(name,txt,isSelf){
    const div=document.createElement('div');
    div.className=`msg-item ${isSelf?'msg-self':''}`;
    div.innerHTML=`<div class="msg-name">${escapeHtml(name)}</div><div class="msg-content ${isSelf?'self':'other'}">${escapeHtml(txt)}</div>`;
    chatBox.appendChild(div);
    chatBox.scrollTop=chatBox.scrollHeight;
}

socket.on('chat_msg',d=>render(d.name,d.text,false));

function send(){
    const name=usernameInput.value.trim()||"匿名";
    const text=msgInput.value.trim();
    if(!text)return;
    render(name,text,true);
    socket.emit('chat_msg',{name,text});
    msgInput.value="";
}
sendBtn.onclick=send;
msgInput.onkeydown=e=>e.key==='Enter'&&send();
</script>
</body>
</html>
