<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#1a1a2e;color:#fff;height:100vh;display:flex;flex-direction:column;padding:12px;max-width:1200px;margin:0 auto}
h1{text-align:center;margin-bottom:12px;font-size:22px}

/*登录弹窗*/
.login-box{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:99}
.login-card{background:#222840;padding:20px;border-radius:12px;width:92%;max-width:360px}
.login-card h2{margin-bottom:16px;text-align:center;font-size:20px}
.login-card input{width:100%;padding:11px;margin:7px 0;border:none;border-radius:8px;background:#2f3454;color:#fff;font-size:16px}
.btn-row{display:flex;gap:10px;margin-top:12px}
button{flex:1;padding:11px;border:none;border-radius:8px;color:#fff;font-size:16px;cursor:pointer}
.btn-login{background:#3478ff}
.btn-reg{background:#27ae60}
.tip{margin-top:10px;color:#ff8888;font-size:14px;text-align:center}

#main-room{display:none;flex:1;flex-direction:column}
#msgbox{flex:1;background:#16213e;border-radius:10px;padding:12px;overflow-y:auto;margin-bottom:10px}
.msg-self{display:flex;flex-direction:column;align-items:flex-end;margin:8px 0}
.msg-other{display:flex;flex-direction:column;align-items:flex-start;margin:8px 0}
.name{font-size:12px;color:#aaa;margin-bottom:2px}
.text{background:#2b58d1;padding:9px 12px;border-radius:12px;max-width:82%}
.msg-other .text{background:#353b54}
.msg-img{max-width:220px;border-radius:10px;margin:4px 0}
.bottom-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#msginput{flex:1;min-width:140px;padding:10px;border-radius:8px;border:none;background:#27293d;color:#fff;font-size:16px}
#img-input{display:none}
#pick-img{padding:0 12px;background:#444870}
#sendbtn{padding:0 14px;background:#3478ff}
#adminPanelBtn{padding:0 12px;background:#995522;display:none}

/*管理员右键菜单（仅保留禁言）*/
.context-menu{position:fixed;background:#222840;border:1px solid #444;border-radius:8px;z-index:100;display:none}
.context-menu div{padding:8px 14px;cursor:pointer}
.context-menu div:hover{background:#343b66}
.system-notice{text-align:center;color:#ffdd77;font-size:13px;margin:6px 0}

/*网页内置输入法UI*/
#ime-panel{display:none;background:#222840;padding:8px;border-radius:10px;margin-top:6px}
.ime-key{display:inline-block;padding:6px 10px;margin:2px;background:#383e68;border-radius:4px;cursor:pointer}
.ime-key:hover{background:#4c5494}

/*管理员后台弹窗*/
.admin-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:none;align-items:center;justify-content:center}
.admin-modal{background:#1f2440;width:94%;max-width:620px;border-radius:12px;padding:16px;max-height:85vh;overflow-y:auto}
.admin-modal h3{margin-bottom:10px}
.block{margin:16px 0}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#2c3152;margin:5px 0;border-radius:6px;gap:6px;flex-wrap:wrap}
.btn-small{padding:4px 9px;border-radius:4px;border:none;color:#fff;font-size:13px;cursor:pointer}
.btn-ban{background:#c82c2c}
.btn-unban{background:#298844}
.btn-mute{background:#d48822}
.btn-close{margin-top:12px;width:100%;padding:10px;background:#444870;border:none;border-radius:8px;color:white}
    </style>
</head>
<body>

<div class="login-box" id="loginModal">
    <div class="login-card">
        <h2>登录 / 注册</h2>
        <input id="inp-user" placeholder="用户名">
        <input id="inp-pwd" type="password" placeholder="密码">
        <div class="btn-row">
            <button class="btn-login" id="btnLogin">登录</button>
            <button class="btn-reg" id="btnReg">注册</button>
        </div>
        <div class="tip" id="loginTip"></div>
    </div>
</div>

<div id="main-room">
    <h1>🌐聊天室 <span id="admin-badge" style="color:#ffdd44;display:none">【管理员】</span></h1>
    <div id="msgbox"></div>

    <div class="bottom-bar">
        <input id="img-input" type="file" accept="image/*">
        <input id="msginput" placeholder="输入消息">
        <button id="pick-img">图片</button>
        <button id="sendbtn">发送</button>
        <button id="openImeBtn">网页输入法</button>
        <button id="adminPanelBtn">管理后台</button>
    </div>
    <div id="ime-panel">
        <div>拼音模拟输入(网页内置)</div>
        <div id="ime-keys"></div>
    </div>
</div>

<!--右键菜单仅保留禁言-->
<div class="context-menu" id="ctxMenu">
    <div data-val="300000">禁言5分钟</div>
    <div data-val="1800000">禁言30分钟</div>
    <div data-val="-1">永久禁言</div>
</div>

<!--管理员后台弹窗-->
<div class="admin-backdrop" id="adminBackdrop">
    <div class="admin-modal">
        <h3>管理员后台</h3>
        <div class="block">
            <h4>全部用户列表（可封禁）</h4>
            <div id="userListBox"></div>
        </div>
        <div class="block">
            <h4>当前禁言列表</h4>
            <div id="muteListBox"></div>
        </div>
        <div class="block">
            <h4>账号封禁列表</h4>
            <div id="banListBox"></div>
        </div>
        <button class="btn-close" id="closeAdminBtn">关闭</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const box = document.getElementById("msgbox");
const loginModal = document.getElementById("loginModal");
const mainRoom = document.getElementById("main-room");
const inpUser = document.getElementById("inp-user");
const inpPwd = document.getElementById("inp-pwd");
const loginTip = document.getElementById("loginTip");
const btnLogin = document.getElementById("btnLogin");
const btnReg = document.getElementById("btnReg");
const msgInput = document.getElementById("msginput");
const sendBtn = document.getElementById("sendbtn");
const pickImgBtn = document.getElementById("pick-img");
const imgInput = document.getElementById("img-input");
const ctxMenu = document.getElementById("ctxMenu");
const adminBadge = document.getElementById("admin-badge");
const openImeBtn = document.getElementById("openImeBtn");
const imePanel = document.getElementById("ime-panel");
const imeKeys = document.getElementById("ime-keys");
const adminPanelBtn = document.getElementById("adminPanelBtn");
const adminBackdrop = document.getElementById("adminBackdrop");
const closeAdminBtn = document.getElementById("closeAdminBtn");
const userListBox = document.getElementById("userListBox");
const muteListBox = document.getElementById("muteListBox");
const banListBox = document.getElementById("banListBox");

let myName = null;
let amIAdmin = false;
let rightClickTargetUser = null;

//渲染消息
function renderMsg(item){
    const div = document.createElement("div");
    if(item.type === "system"){
        div.className = "system-notice";
        div.innerText = item.msg;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return;
    }
    div.className = item.sender === myName ? "msg-self" : "msg-other";
    div.dataset.username = item.sender;
    div.innerHTML = `<div class="name">${item.sender}</div>`;
    if(item.img){
        div.innerHTML += `<img class="msg-img" src="${item.img}">`;
    }else{
        div.innerHTML += `<div class="text">${escapeHtml(item.text)}</div>`;
    }
    if(amIAdmin && item.sender !== myName){
        div.oncontextmenu = function(e){
            e.preventDefault();
            rightClickTargetUser = item.sender;
            ctxMenu.style.display="block";
            ctxMenu.style.left = e.pageX + "px";
            ctxMenu.style.top = e.pageY + "px";
        }
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
function escapeHtml(str){
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

socket.on("history",arr=>{
    box.innerHTML="";
    arr.forEach(renderMsg);
})
socket.on("chat",d=>renderMsg(d));
socket.on("systemNotice",d=>renderMsg({type:"system",msg:d.msg}));

document.body.onclick=()=>ctxMenu.style.display="none";
ctxMenu.querySelectorAll("div").forEach(el=>{
    el.onclick = async ()=>{
        const dur = Number(el.dataset.val);
        ctxMenu.style.display="none";
        if(!rightClickTargetUser) return;
        await fetch("/api/mute",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({adminName:myName,targetUser:rightClickTargetUser,durationMs:dur})
        })
    }
})

//登录
async function doLogin(isReg){
    loginTip.innerText="";
    const u = inpUser.value.trim();
    const p = inpPwd.value.trim();
    const res = await fetch(isReg?"/api/register":"/api/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:u,password:p})
    })
    const json = await res.json();
    if(!json.ok){
        loginTip.innerText = json.msg;
        return;
    }
    myName = json.username || u;
    amIAdmin = !!json.isAdmin;
    if(amIAdmin){
        adminBadge.style.display="inline";
        adminPanelBtn.style.display="inline-block";
    }
    loginModal.style.display="none";
    mainRoom.style.display="flex";
}
btnLogin.onclick=()=>doLogin(false);
btnReg.onclick=()=>doLogin(true);

//发送文字
function sendText(){
    const text = msgInput.value.trim();
    if(!text||!myName) return;
    socket.emit("chat",{sender:myName, text:text});
    msgInput.value="";
}
sendBtn.onclick = sendText;
msgInput.onkeydown = e=>{if(e.key==="Enter") sendText()}

//发送图片
pickImgBtn.onclick=()=>imgInput.click();
imgInput.onchange = async function(){
    const file = this.files[0];
    if(!file||!myName) return;
    const fd = new FormData();
    fd.append("img",file);
    const res = await fetch("/api/upload",{method:"POST",body:fd});
    const j = await res.json();
    if(j.ok){
        socket.emit("chat",{sender:myName, img:j.url});
    }
    imgInput.value="";
}

//网页简易输入法
openImeBtn.onclick=()=>{
    imePanel.style.display = imePanel.style.display==="block"?"none":"block";
}
const pinyinKeys = ["a","b","c","d","e","f","g","h","i","j","k","l","m","n","o","p","q","r","s","t","u","v","w","x","y","z"," ","Backspace"];
imeKeys.innerHTML = pinyinKeys.map(k=>`<span class="ime-key">${k}</span>`).join("");
imeKeys.querySelectorAll(".ime-key").forEach(kn=>{
    kn.onclick = function(){
        const ch = this.innerText;
        if(ch==="Backspace") msgInput.value = msgInput.value.slice(0,-1);
        else msgInput.value += ch;
    }
})

//管理员后台
adminPanelBtn.onclick = async ()=>{
    const res = await fetch("/api/admin-data",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({adminName:myName})
    })
    const j = await res.json();
    if(!j.ok) return;

    //用户列表，附带封禁按钮
    userListBox.innerHTML = j.userList.map(u=>{
        return `<div class="item-row">
            <span>${u.username} ${u.isAdmin?"(管理员)":""}</span>
            ${u.isAdmin?"":`<button class="btn-small btn-ban" data-user="${u.username}">永久封禁账号</button>`}
        </div>`
    }).join("");
    userListBox.querySelectorAll(".btn-ban").forEach(btn=>{
        btn.onclick = async function(){
            const target = this.dataset.user;
            await fetch("/api/ban",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({adminName:myName,targetUser:target})
            })
            adminPanelBtn.click();
        }
    })

    //禁言列表+解除禁言
    muteListBox.innerHTML = "";
    if(j.muteList.length===0){
        muteListBox.innerHTML = `<div style="padding:6px;color:#aaa">暂无禁言用户</div>`;
    }else{
        j.muteList.forEach(m=>{
            let expireText = m.expire === -1 ? "永久" : new Date(m.expire).toLocaleString();
            const div = document.createElement("div");
            div.className = "item-row";
            div.innerHTML = `<span>${m.username}｜到期：${expireText}</span>
            <button class="btn-small btn-unban" data-user="${m.username}">解除禁言</button>`;
            muteListBox.appendChild(div);
        })
        muteListBox.querySelectorAll(".btn-unban").forEach(btn=>{
            btn.onclick = async function(){
                const target = this.dataset.user;
                await fetch("/api/unmute",{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({adminName:myName,targetUser:target})
                })
                adminPanelBtn.click();
            }
        })
    }

    //封禁列表+解除封禁
    banListBox.innerHTML = "";
    if(j.banList.length===0){
        banListBox.innerHTML = `<div style="padding:6px;color:#aaa">暂无封禁账号</div>`;
    }else{
        j.banList.forEach(b=>{
            const banTime = new Date(b.banTime).toLocaleString();
            const div = document.createElement("div");
            div.className = "item-row";
            div.innerHTML = `<span>${b.username}｜封禁时间：${banTime}</span>
            <button class="btn-small btn-unban" data-user="${b.username}">解除封禁</button>`;
            banListBox.appendChild(div);
        })
        banListBox.querySelectorAll(".btn-unban").forEach(btn=>{
            btn.onclick = async function(){
                const target = this.dataset.user;
                await fetch("/api/unban",{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({adminName:myName,targetUser:target})
                })
                adminPanelBtn.click();
            }
        })
    }
    adminBackdrop.style.display="flex";
}
closeAdminBtn.onclick = ()=> adminBackdrop.style.display="none";
</script>
</body>
</html>
